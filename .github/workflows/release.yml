name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "版本号"
        required: false
        type: string

permissions:
  contents: write
  packages: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.out.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve
        id: out
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${{ inputs.version }}" ]]; then
            VER="${{ inputs.version }}"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            VER="${GITHUB_REF_NAME#v}"
          else
            VER="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          fi
          if [[ ! "$VER" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-].+)?$ ]]; then
            echo "invalid version: $VER" >&2
            exit 1
          fi
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "Resolved version: $VER"

  binaries:
    name: Binary (${{ matrix.asset_name }})
    needs: version
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
            asset_os: linux
            asset_arch: amd64
            asset_libc: musl
            asset_name: linux-amd64-musl
            bin: oakis
            musl: true

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            asset_os: linux
            asset_arch: arm64
            asset_libc: musl
            asset_name: linux-arm64-musl
            bin: oakis
            musl: true

          - runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_os: linux
            asset_arch: amd64
            asset_libc: gnu
            asset_name: linux-amd64-gnu
            bin: oakis
            musl: false

          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            asset_os: linux
            asset_arch: arm64
            asset_libc: gnu
            asset_name: linux-arm64-gnu
            bin: oakis
            musl: false

          - runner: macos-15-intel
            target: x86_64-apple-darwin
            asset_os: darwin
            asset_arch: amd64
            asset_libc: ""
            asset_name: darwin-amd64
            bin: oakis
            musl: false

          - runner: macos-15
            target: aarch64-apple-darwin
            asset_os: darwin
            asset_arch: arm64
            asset_libc: ""
            asset_name: darwin-arm64
            bin: oakis
            musl: false

          - runner: windows-latest
            target: x86_64-pc-windows-msvc
            asset_os: windows
            asset_arch: amd64
            asset_libc: ""
            asset_name: windows-amd64
            bin: oakis.exe
            musl: false

          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            asset_os: windows
            asset_arch: arm64
            asset_libc: ""
            asset_name: windows-arm64
            bin: oakis.exe
            musl: false

    steps:
      - uses: actions/checkout@v5

      - name: Install musl toolchain
        if: matrix.musl
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends musl-tools

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build release
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          case "${TARGET}" in
            *-linux-musl)
              export CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              export CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc
              ;;
          esac
          cargo build --release --locked --target "${TARGET}"

      - name: Strip binary
        if: matrix.asset_os != 'windows'
        shell: bash
        run: strip "target/${{ matrix.target }}/release/${{ matrix.bin }}" || true

      - name: Package
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
          ASSET_OS: ${{ matrix.asset_os }}
          ASSET_ARCH: ${{ matrix.asset_arch }}
          ASSET_LIBC: ${{ matrix.asset_libc }}
          TARGET: ${{ matrix.target }}
          BIN: ${{ matrix.bin }}
        run: |
          set -euo pipefail
          if [[ -n "${ASSET_LIBC}" ]]; then
            NAME="oakis_${VERSION}_${ASSET_OS}_${ASSET_ARCH}_${ASSET_LIBC}"
          else
            NAME="oakis_${VERSION}_${ASSET_OS}_${ASSET_ARCH}"
          fi
          STAGE="dist/${NAME}"
          mkdir -p "${STAGE}"

          SRC="target/${TARGET}/release/${BIN}"
          cp "${SRC}" "${STAGE}/${BIN}"
          if [[ "${ASSET_OS}" != "windows" ]]; then
            chmod +x "${STAGE}/${BIN}"
          fi

          mkdir -p dist
          tar -C "${STAGE}" -czf "dist/${NAME}.tar.gz" .
          ls -lh "dist/${NAME}.tar.gz"
          echo "ASSET_FILE=${NAME}.tar.gz" >> "$GITHUB_ENV"
          echo "ASSET_STEM=${NAME}" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: oakis-${{ needs.version.outputs.version }}-${{ matrix.asset_name }}
          path: dist/${{ env.ASSET_STEM }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker (GHCR, from musl artifacts)
    needs: [ version, binaries ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Download linux musl artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: oakis-${{ needs.version.outputs.version }}-linux-*-musl
          path: art
          merge-multiple: true

      - name: Assemble image context
        shell: bash
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          ls -lah art

          CTX=docker-ctx
          mkdir -p "${CTX}/binaries/amd64" "${CTX}/binaries/arm64"

          tmp=$(mktemp -d)
          tar -xzf "art/oakis_${VERSION}_linux_amd64_musl.tar.gz" -C "$tmp"
          cp "$tmp/oakis" "${CTX}/binaries/amd64/oakis"
          chmod +x "${CTX}/binaries/amd64/oakis"
          rm -rf "$tmp"

          tmp=$(mktemp -d)
          tar -xzf "art/oakis_${VERSION}_linux_arm64_musl.tar.gz" -C "$tmp"
          cp "$tmp/oakis" "${CTX}/binaries/arm64/oakis"
          chmod +x "${CTX}/binaries/arm64/oakis"
          rm -rf "$tmp"

          cp Dockerfile "${CTX}/Dockerfile"

          echo "context:"
          find "${CTX}" -type f | sort
          ls -lh "${CTX}/binaries/"*/oakis

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=${{ needs.version.outputs.version }}
            type=raw,value=latest,enable=${{ github.ref_type == 'tag' || inputs.version != '' }}

      - name: Build and push (scratch, multi-arch)
        uses: docker/build-push-action@v6
        with:
          context: docker-ctx
          file: docker-ctx/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  release:
    name: GitHub Release
    needs: [ version, binaries, docker ]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    steps:
      - name: Download all binary artifacts
        uses: actions/download-artifact@v6
        with:
          pattern: oakis-${{ needs.version.outputs.version }}-*
          path: release-assets
          merge-multiple: true

      - name: List assets
        shell: bash
        run: ls -lah release-assets

      - name: Create / update Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: oakis ${{ needs.version.outputs.version }}
          generate_release_notes: true
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}