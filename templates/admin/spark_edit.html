{% extends "admin/base.html" %}

{% block title %}编辑灵感 · {{ settings.site_title }}{% endblock %}

{% block content %}
<div class="admin-card admin-compose">
  {% match error %}
  {% when Some with (message) %}
  <div class="layui-bg-red admin-toast-error" role="alert" style="color:#fff;padding:10px 12px;margin-bottom:12px;border-radius:2px">{{ message }}</div>
  {% when None %}
  {% endmatch %}

  <form class="layui-form" method="post" action="/admin/sparks/{{ id }}/edit" novalidate>
    <div class="layui-form-item layui-form-text">
      <label class="layui-form-label"><span style="color:#FF5722;">*</span>内容</label>
      <div class="layui-input-block">
        <textarea name="content_md" lay-verify="required" lay-reqtext="请填写内容" maxlength="5000" class="layui-textarea admin-spark-body" rows="14">{{ content_md }}</textarea>
      </div>
    </div>
    <div class="layui-form-item">
      <label class="layui-form-label">可见性</label>
      <div class="layui-input-block">
        <input type="radio" name="visibility" value="private" title="私密"{% if visibility != "public" %} checked{% endif %}>
        <input type="radio" name="visibility" value="public" title="公开"{% if visibility == "public" %} checked{% endif %}>
      </div>
    </div>
    <div class="layui-form-item admin-edit-actions">
      <button type="submit" class="layui-btn layui-btn-sm layui-btn-normal" formaction="/admin/sparks/{{ id }}/to-post" data-confirm="升格为草稿文章？将先保存当前内容，灵感仍会保留。">升格为文章</button>
      <a class="layui-btn layui-btn-sm layui-btn-primary" href="/admin/sparks">返回</a>
      <button class="layui-btn layui-btn-sm" lay-submit type="submit">保存</button>
    </div>
  </form>
</div>
{% endblock %}
