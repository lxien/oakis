<li class="feed-item">
  <div class="feed-entry{% if !post.has_cover() %} no-thumb{% endif %}">
    <a class="feed-hit" href="/posts/{{ post.slug() }}" aria-label="{{ post.title() }}"></a>
    <div class="feed-main">
      <h2 class="feed-title">{{ post.title() }}</h2>
      <p class="feed-summary{% if post.summary().is_empty() %} is-empty{% endif %}">{% if !post.summary().is_empty() %}{{ post.summary() }}{% endif %}</p>
      <div class="feed-foot">
        <div class="feed-meta">
          <span class="feed-author">{{ settings.author_name }}</span>
          <span class="feed-dot" aria-hidden="true"></span>
          <time datetime="{{ post.display_date() }}">{{ post.short_date() }}</time>
        </div>
        <div class="feed-tags tax-chips" aria-label="标签">
          {% for t in post.tags %}
          <a class="tax-chip is-tag" href="/tags/{{ t.slug }}">{{ t.name }}</a>
          {% endfor %}
        </div>
      </div>
    </div>
    {% if post.has_cover() %}
    <div class="feed-thumb" aria-hidden="true">
      <img src="{{ post.cover() }}" alt="" loading="lazy">
    </div>
    {% endif %}
  </div>
</li>
